spring:
  application:
    name: barberplug
  config:
    # Local secrets (OWNER_EMAIL, ...) can live in backend/.env, which git ignores.
    import: optional:file:.env[.properties]
  datasource:
    # Defaults match docker-compose.yml; production overrides them with env vars.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/barberplug}
    username: ${DB_USERNAME:barberplug}
    password: ${DB_PASSWORD:barberplug}
  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      # MASTER.md: JPEG/PNG/WebP up to 15 MB per photo.
      max-file-size: 15MB
      max-request-size: 16MB

server:
  port: ${PORT:8080}
  shutdown: graceful
  # Behind the ALB: trust X-Forwarded-For from private addresses, so the
  # login rate limit sees the Visitor's IP instead of the load balancer's.
  forward-headers-strategy: native
  tomcat:
    # Read (and discard) oversized uploads so the browser gets the 413 answer
    # instead of a dropped connection.
    max-swallow-size: 20MB
  servlet:
    session:
      timeout: 8h
      cookie:
        name: BP_SESSION
        http-only: true
        secure: true
        same-site: lax

barberplug:
  storage:
    # Defaults are for LocalStack in docker-compose.yml. Production sets STORAGE_ENDPOINT
    # empty (real S3), the CloudFront URL, and STORAGE_CREATE_BUCKET=false (Terraform owns it).
    bucket: ${STORAGE_BUCKET:barberplug-gallery}
    region: ${AWS_REGION:eu-central-1}
    endpoint: ${STORAGE_ENDPOINT:http://localhost:4566}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:4566/barberplug-gallery}
    create-bucket: ${STORAGE_CREATE_BUCKET:true}
  owner:
    # Only used to create the Owner on first start (ADR-0006).
    email: ${OWNER_EMAIL:}
    initial-password: ${OWNER_INITIAL_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
